server {
    listen 80;
    server_name rendahomes.com www.rendahomes.com;

    root /var/www/rendahomes/frontend-main;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /sitemap.xml {
        try_files /sitemap.xml =404;
    }

    location = /robots.txt {
        try_files /robots.txt =404;
    }
}

server {
    listen 80;
    server_name landlord.rendahomes.com;

    root /var/www/rendahomes/frontend-landlord;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name user.rendahomes.com;

    root /var/www/rendahomes/frontend-user;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name app.rendahomes.com;

    root /var/www/rendahomes/frontend-app;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name updates.rendahomes.com;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
