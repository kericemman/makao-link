server {
    listen 80;
    server_name rendahomes.com www.rendahomes.com;

    root /var/www/rendahomes/frontend-main;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:5000/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(listings|blog)/[^/]+$ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        try_files /robots.txt =404;
    }
}

server {
    listen 80;
    server_name landlord.rendahomes.com;

    root /var/www/rendahomes/frontend-landlord;
    index index.html;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

