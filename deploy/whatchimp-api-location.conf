# Include inside the EXISTING TLS server {} for api.rendahomes.com.
# Keep its current listen/SSL/certificate directives untouched.
location ~ ^/api/webhooks/whatchimp/[A-Za-z0-9_-]{32,}$ {
    client_max_body_size 64k;
    limit_req zone=whatchimp_api burst=50 nodelay;
    limit_req_status 429;

    # The token is a bearer secret in the path. Disable inherited logs here.
    access_log off;
    error_log /dev/null crit;

    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Referer "";
}
